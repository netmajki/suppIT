# Produkcja na VPS: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: suppit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: suppit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suppit"]
      interval: 5s
      retries: 10

  # Jednorazowo: migracje + seed (konto admina, domyślne ustawienia)
  migrate:
    build: { context: ., target: builder }
    environment: &appenv
      DATABASE_URL: postgresql://suppit:${POSTGRES_PASSWORD}@db:5432/suppit?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?ustaw AUTH_SECRET w .env}
      AUTH_TRUST_HOST: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-kontakt@suppit.me}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment: *appenv
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-suppit.me}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
